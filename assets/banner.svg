<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07172b"/>
      <stop offset="100%" stop-color="#0d081f"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(260px); }
      }
      .radar-sweep {
        transform-origin: 780px 130px;
        animation: radarSweep 8s linear infinite;
      }
      .pulse-circle {
        transform-origin: 780px 130px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dashFlow 2s linear infinite;
      }
      .title-text {
        font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 34px;
        fill: url(#titleGrad);
      }
      .subtitle-text {
        font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 15px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyber Grid (Background Layer) -->
  <g opacity="0.15">
    <path d="M 0 40 L 900 40 M 0 80 L 900 80 M 0 120 L 900 120 M 0 160 L 900 160 M 0 200 L 900 200 M 0 240 L 900 240" stroke="#00f2fe" stroke-width="1"/>
    <path d="M 100 0 L 100 260 M 200 0 L 200 260 M 300 0 L 300 260 M 400 0 L 400 260 M 500 0 L 500 260 M 600 0 L 600 260 M 700 0 L 700 260 M 800 0 L 800 260" stroke="#00f2fe" stroke-width="1"/>
  </g>

  <!-- Animated Background Elements (Radar & Nodes - Right Side) -->
  <g opacity="0.4">
    <circle cx="780" cy="130" r="100" fill="none" stroke="#00c6ff" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="780" cy="130" r="70" fill="none" stroke="#7928ca" stroke-width="1.5"/>
    <circle cx="780" cy="130" r="40" fill="none" stroke="#00f2fe" stroke-width="1"/>
    <circle cx="780" cy="130" r="110" fill="none" class="pulse-circle" stroke="#ff007f" stroke-width="2"/>
    
    <!-- Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 780 130 L 880 130 A 100 100 0 0 0 780 30 Z" fill="url(#titleGrad)" opacity="0.25"/>
    </g>
  </g>

  <!-- Animated Attack Simulation Flow Lines (Background Layer) -->
  <g opacity="0.5">
    <path d="M 50 200 Q 250 230 450 190 T 780 130" fill="none" stroke="#00f2fe" stroke-width="2" class="flow-line"/>
    <path d="M 50 60 Q 300 30 550 70 T 780 130" fill="none" stroke="#ff007f" stroke-width="1.5" class="flow-line"/>
  </g>

  <!-- Scanline effect (Behind Text) -->
  <rect width="900" height="4" fill="url(#titleGrad)" opacity="0.15" style="animation: scanline 4s linear infinite;"/>

  <!-- Foreground Content (Text & Badges) -->
  <g filter="url(#shadow)">
    <!-- Category Tag -->
    <rect x="50" y="42" width="220" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="160" y="59" text-anchor="middle" class="tag-text">🛡️ ADVERSARY EMULATION &amp; BAS</text>

    <!-- Main Title -->
    <text x="50" y="115" class="title-text" filter="url(#glow)">Awesome Breach &amp; Attack Simulation</text>

    <!-- Subtitle -->
    <text x="50" y="150" class="subtitle-text">Curated SaaS Platforms, Open-Source Tools &amp; Security Validation Frameworks</text>

    <!-- Feature Pills -->
    <g transform="translate(50, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600">🎯 MITRE ATT&amp;CK</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="212.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a855f7" font-weight="600">🟣 Purple Teaming</text>

      <!-- Pill 3 -->
      <rect x="295" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="372.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f43f5e" font-weight="600">⚡ Continuous Validation</text>
    </g>
  </g>
</svg>
